name: Build Custom LobeHub Image

on:
  push:
    branches:
      - 'release/v2.2.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.ref_name }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.description=Custom LobeHub build with TOOL_RESULT_MAX_LENGTH and CRAWL_MAX_HTML_SIZE env vars

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as artifact
        run: |
          # Find image by repository name (the image has multiple tags from metadata-action)
          IMAGE=$(docker images "ghcr.io/kingdoum/lobehub" -q | head -1)
          if [ -z "$IMAGE" ]; then
            echo "ERROR: image not found locally"
            docker images | head -10
            exit 1
          fi
          docker save "$IMAGE" | gzip > lobe-image.tar.gz
          echo "Image size: $(du -sh lobe-image.tar.gz | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lobehub-custom-image
          path: lobe-image.tar.gz
          retention-days: 7
